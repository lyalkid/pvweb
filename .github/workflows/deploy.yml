name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement включает Pages через API, если он ещё не включён в настройках
      # репозитория. Шаг стоит до сборки, чтобы отказ всплывал сразу.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Версия берётся из .nvmrc: jsdom тянет undici, которому нужен Node >= 22.19.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установить зависимости
        run: make install-ci

      # Проверки, тесты и сборка. BASE обязателен: сайт отдаётся из подкаталога
      # /<репозиторий>/, иначе ссылки на ассеты ведут в корень домена.
      - name: Проверить и собрать
        run: make ci BASE=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
